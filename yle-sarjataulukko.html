<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yle Teksti-TV · Liigan sarjataulukko</title>
<style>
:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--width:1100px;--scale:1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.stage{position:fixed;left:calc(50% + var(--ox,0px));top:calc(50% + var(--oy,0px));width:var(--width);transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;filter:drop-shadow(0 5px 12px rgba(0,0,0,.42))}
.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--ink);border-bottom:4px solid var(--accent);padding:13px 20px;min-height:64px}
.heading-title{font-size:27px;font-weight:900;letter-spacing:.055em;text-transform:uppercase}
.competition{text-align:right;font-size:15px;color:var(--muted);font-weight:800}
.subheading{background:var(--panel);padding:9px 20px;font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;background:rgba(16,24,32,.98)}
thead{background:var(--accent);color:var(--ink)}
th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;font-weight:900;padding:10px 9px;text-align:right;white-space:nowrap}
th:nth-child(2){text-align:left}
td{padding:8px 9px;border-bottom:1px solid #34434d;text-align:right;font-size:17px;font-weight:800;white-space:nowrap}
td:nth-child(2){text-align:left;white-space:normal}
tbody tr:nth-child(even){background:rgba(27,42,53,.96)}
tbody tr.top{background:#263b48;box-shadow:inset 4px 0 0 var(--accent)}
.rank{color:var(--accent);width:48px}
.team{font-weight:900;text-transform:uppercase}
.points{color:var(--accent);font-size:20px}
.goal{color:#d6dfe5}
.note{padding:9px 14px;background:rgba(16,24,32,.97);color:var(--muted);font-size:12px;border-top:2px solid var(--accent);display:flex;justify-content:space-between;gap:12px}
.error{position:fixed;left:8px;bottom:8px;background:rgba(16,24,32,.97);border-left:4px solid #e8c547;padding:10px 14px;color:#fff;font-size:14px;max-width:calc(100vw - 16px);white-space:pre-wrap}
@media(max-width:900px){.heading{padding:9px 12px;min-height:48px}.heading-title{font-size:20px}.competition{font-size:11px}.subheading{padding:7px 12px;font-size:10px}th{font-size:10px;padding:7px 5px}td{font-size:13px;padding:6px 5px}.points{font-size:15px}.rank{width:28px}.note{font-size:10px}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="heading"><div class="heading-title">Sarjataulukko</div><div class="competition">YLEN TEKSTI-TV · SIVU <span id="pageLabel">223</span></div></div>
 <div class="subheading"><span id="leagueTitle">JÄÄKIEKKO · SM-LIIGA</span><span id="subpage">1/3</span></div>
 <table aria-label="Sarjataulukko">
  <thead><tr><th>Sij.</th><th>Joukkue</th><th>O</th><th>V</th><th>JV</th><th>JT</th><th>H</th><th>M</th><th>P</th></tr></thead>
  <tbody id="rows"><tr><td colspan="9" style="text-align:center;padding:22px">Haetaan sarjataulukkoa Ylen Teksti-TV:stä…</td></tr></tbody>
 </table>
 <div class="note"><span id="footnote">Lähde: Yle Teksti-TV</span><span id="updated">Päivitys 5 s välein</span></div>
</div>
<div id="error" class="error" hidden></div>
<script>
(()=> {
 const q=new URLSearchParams(location.search);
 const page=(q.get('page')||'223').replace(/\D/g,'').slice(0,3)||'223';
 const refresh=Math.max(5,Math.min(300,Number(q.get('refresh')||5)))*1000;
 const width=Math.max(500,Math.min(2200,Number(q.get('width')||1100)));
 const scale=Math.max(.4,Math.min(2.5,Number(q.get('scale')||1)));
 const ox=Number(q.get('offsetX')||0), oy=Number(q.get('offsetY')||0);
 document.documentElement.style.setProperty('--width',width+'px');
 document.documentElement.style.setProperty('--scale',scale);
 document.documentElement.style.setProperty('--ox',(Number.isFinite(ox)?ox:0)+'px');
 document.documentElement.style.setProperty('--oy',(Number.isFinite(oy)?oy:0)+'px');
 document.getElementById('pageLabel').textContent=page;
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function update(){
   try{
     const u=new URL('/api/yle-tekstitv',location.origin);u.searchParams.set('page',page);u.searchParams.set('ts',Date.now());
     const r=await fetch(u,{cache:'no-store'});const d=await r.json();
     if(!r.ok)throw Error(d.error||'Ylen sivun haku epäonnistui');
     const rows=Array.isArray(d.rows)?d.rows:[];
     $('leagueTitle').textContent=d.title||'SARJATAULUKKO';
     $('subpage').textContent=d.subpage||'';
     if(!rows.length)throw Error('Sivulta ei löytynyt sarjataulukon rivejä. Tarkista sivunumero ja lähdesivun rakenne.');
     $('rows').innerHTML=rows.map((x,i)=>`<tr class="${i===0?'top':''}"><td class="rank">${esc(x.rank||i+1)}</td><td class="team">${esc(x.team)}</td><td>${esc(x.played)}</td><td>${esc(x.won)}</td><td>${esc(x.otw)}</td><td>${esc(x.otl)}</td><td>${esc(x.lost)}</td><td class="goal">${esc(x.goals)}</td><td class="points">${esc(x.points)}</td></tr>`).join('');
     $('footnote').textContent=d.footer||'Lähde: Yle Teksti-TV';
     $('updated').textContent='Päivitetty '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
     $('error').hidden=true;
   }catch(e){$('error').hidden=false;$('error').textContent='Sarjataulukon päivitys epäonnistui: '+(e.message||e)+'\\nTarkista, että tämä projekti on julkaistu Vercelissä API-kansion kanssa.';}
 }
 if(q.get('debug')==='1'){
   const b=document.createElement('div');b.style.cssText='position:fixed;right:8px;bottom:8px;background:#101820;border:1px solid #e8c547;color:white;padding:8px;font:12px/1.4 Arial;z-index:9999';
   b.textContent=`DEBUG · sivu ${page} · ${width}px · skaala ${scale} · päivitys ${refresh/1000}s`;document.body.appendChild(b);
 }
 update();setInterval(update,refresh);
})();
</script>
</body></html>
